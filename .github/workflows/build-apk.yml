# Builds the Android app on every push and publishes it as a GitHub Release.
# Phone download link (always the newest build):
#   https://github.com/reyffer/helix-remote/releases/latest/download/helix-remote.apk
name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"

      - name: Build
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon assembleRelease

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/release/app-release.apk helix-remote.apk
          gh release create "v1.${{ github.run_number }}" helix-remote.apk \
            --title "Helix Remote 1.${{ github.run_number }}" \
            --notes "Built from ${{ github.sha }}. Install helix-remote.apk on the phone." \
            --latest
